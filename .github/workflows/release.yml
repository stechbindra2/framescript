name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run extension:install
      - run: npm run release:verify
      - run: npm run grammar:test
      - name: Build release artifacts
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            npm run release:artifacts -- --pre-release
          else
            npm run release:artifacts
          fi
      - name: Select npm distribution tag
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: echo "NPM_TAG=$([ "$PRERELEASE" = "true" ] && echo next || echo latest)" >> "$GITHUB_ENV"
      - name: Publish compiler
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npm view "framescript@$VERSION" version >/dev/null 2>&1 || npm publish --access public --tag "$NPM_TAG"
      - name: Publish Tree-sitter grammar
        run: |
          VERSION=$(node -p "require('./tree-sitter-framescript/package.json').version")
          npm view "tree-sitter-framescript@$VERSION" version >/dev/null 2>&1 || npm publish ./tree-sitter-framescript --access public --tag "$NPM_TAG"
      - name: Attach verified artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
